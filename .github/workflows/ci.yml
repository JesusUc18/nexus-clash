name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: index.html y bundle.js al día
        run: node tools/build.mjs --check
      - name: Pruebas del motor (simulación headless + huella dorada)
        run: node tools/test.mjs
