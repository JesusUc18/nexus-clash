<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0b0f">
  <title>NEXUS CLASH · Ultimate Arena V1.2.1</title>
  <meta name="description" content="Juego de lucha de plataformas 2D gratis en el navegador: 36 luchadores, 5 escenarios, modos Horda y Práctica, Tier List oficial y controles táctiles para teléfono.">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="application-name" content="Nexus Clash">
  <meta name="apple-mobile-web-app-title" content="Nexus Clash">
  <!-- Vista previa al compartir el enlace (WhatsApp, Discord, X, Facebook…) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Nexus Clash">
  <meta property="og:title" content="NEXUS CLASH · Ultimate Arena V1.2.1">
  <meta property="og:description" content="36 luchadores, modo Horda y controles táctiles. Juega gratis en el navegador, en tu lap o en tu teléfono.">
  <meta property="og:url" content="https://jesusuc18.github.io/nexus-clash/">
  <meta property="og:image" content="https://jesusuc18.github.io/nexus-clash/assets/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="es_MX">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="NEXUS CLASH · Ultimate Arena V1.2.1">
  <meta name="twitter:description" content="36 luchadores, modo Horda y controles táctiles. Juega gratis en el navegador.">
  <meta name="twitter:image" content="https://jesusuc18.github.io/nexus-clash/assets/og.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <div id="hud" class="hidden"></div>
    <div id="announcer"></div>
    <div id="screens" class="screens"></div>
    <div id="transition"><div class="slab a"></div><div class="slab b"></div><div class="slab c"></div></div>
  </div>

  <!-- Núcleo del motor (Parte 1) -->
  <script src="js/engine/physics.js"></script>
  <script src="js/engine/audio.js"></script>
  <script src="js/engine/input.js"></script>
  <script src="js/engine/touch.js"></script>
  <script src="js/engine/combat.js"></script>
  <script src="js/engine/renderer.js"></script>
  <script src="js/engine/fighter.js"></script>
  <script src="js/engine/camera.js"></script>
  <script src="js/engine/match.js"></script>
  <!-- Contenido (Parte 2: luchadores · Parte 3: escenarios, IA y empaquetador ZIP) -->
  <script src="js/stages/stages.js" onerror="this.remove()"></script>
  <script src="js/fighters/kits.js" onerror="this.remove()"></script>
  <script src="js/fighters/roster.js" onerror="this.remove()"></script>
  <script src="js/engine/ai.js" onerror="this.remove()"></script>
  <script src="js/tools/packager.js" onerror="this.remove()"></script>
  <!-- Interfaz y arranque -->
  <script src="js/ui/changelog.js"></script>
  <script src="js/ui/tierlist.js"></script>
  <script src="js/ui/hud.js"></script>
  <script src="js/ui/menus.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
